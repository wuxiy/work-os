[package]
name = "workos-desktop"
version = "0.1.0"
description = "Work-OS —— 本地优先、插件驱动的开发者工作台"
edition = "2021"

[lib]
name = "workos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
workos-core = { workspace = true }
workos-storage = { workspace = true }
workos-permission = { workspace = true }
workos-network = { workspace = true }
workos-plugin-runtime = { workspace = true }
workos-manual = { workspace = true }
workos-native = { workspace = true }
tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
